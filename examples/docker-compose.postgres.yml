# Optional: NetShield Monitor with PostgreSQL instead of SQLite.
#   docker compose -f docker-compose.yml -f examples/docker-compose.postgres.yml up -d
# and put into ./secrets/database_url:
#   postgresql+asyncpg://netshield:<password>@postgres:5432/netshield
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netshield
      POSTGRES_USER: netshield
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - netshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netshield"]
      interval: 10s
      retries: 10
  netshield:
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  netshield_pg:
