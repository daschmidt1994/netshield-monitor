# NetShield Monitor
#   cp .env.example .env  ·  put secrets into ./secrets/ (see docs/installation.md)  ·  docker compose up -d
#
# Runs on any Docker host. If NetShield runs on the same host as NetBird/CrowdSec, add the
# override that joins their Docker network:
#   docker compose -f docker-compose.yml -f docker-compose.netbird-host.yml up -d
services:
  netshield:
    image: ghcr.io/daschmidt1994/netshield-monitor:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: netshield-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      NETSHIELD_DATABASE_URL_FILE: /run/secrets/database_url
      NETSHIELD_NETBIRD_TOKEN_FILE: /run/secrets/netbird_token
      NETSHIELD_CROWDSEC_BOUNCER_KEY_FILE: /run/secrets/crowdsec_bouncer_key
      NETSHIELD_CROWDSEC_MACHINE_PASSWORD_FILE: /run/secrets/crowdsec_machine_password
      NETSHIELD_NTFY_TOKEN_FILE: /run/secrets/ntfy_token
    secrets:
      - database_url
      - netbird_token
      - crowdsec_bouncer_key
      - crowdsec_machine_password
      - ntfy_token
    volumes:
      - netshield_data:/data
    # 127.0.0.1 by default. On a home server set NETSHIELD_BIND to the LAN IP (or 0.0.0.0) to reach the UI
    # from your network; publish it to the internet only through a TLS proxy (e.g. a NetBird service).
    ports:
      - "${NETSHIELD_BIND:-127.0.0.1}:${NETSHIELD_PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

secrets:
  # Empty file = not used (database_url empty → built-in SQLite in the data volume).
  database_url:
    file: ./secrets/database_url
  netbird_token:
    file: ./secrets/netbird_token
  crowdsec_bouncer_key:
    file: ./secrets/crowdsec_bouncer_key
  crowdsec_machine_password:
    file: ./secrets/crowdsec_machine_password
  ntfy_token:
    file: ./secrets/ntfy_token

volumes:
  netshield_data:
    name: netshield_data   # fixed name, independent of the directory/project name
