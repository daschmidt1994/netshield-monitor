[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netshield-monitor"
version = "0.1.4"
description = "Self-hosted traffic & security monitor for NetBird reverse proxy and CrowdSec"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "aiosqlite>=0.20",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
netshield = "netshield.cli:main"

[tool.setuptools.packages.find]
include = ["netshield*"]

[tool.setuptools.package-data]
netshield = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
